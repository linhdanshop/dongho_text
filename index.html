<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đồng Hồ Trực Tuyến</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* đẩy lên trên */
        }

        .overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .container {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        #clock {
            color: #ffffff;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1; /* bỏ khoảng dư phía trên */
        }

        #date {
            color: #ffffff;
            font-size: 23px;
            font-weight: 700;
            line-height: 1;
        }

        .ticker {
            width: var(--ticker-width, 190px);
            max-width: 100vw;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
            contain: layout paint;
            transform: translateZ(0);
        }

        .ticker span {
            display: inline-block;
            padding-left: var(--ticker-width, 190px);
            color: #000000;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 21px;
            font-weight: 800;
            line-height: 1.45;
            text-rendering: auto;
            -webkit-font-smoothing: subpixel-antialiased;
            backface-visibility: hidden;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            animation: marquee 42s linear infinite;
        }

        @keyframes marquee {
            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(-100%, 0, 0);
            }
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <div id="clock"></div>
        <div id="date"></div>
    </div>

    <div class="ticker">
        <span>Không gọi xin mã, không nhắn tin lúc live, shop chốt đơn gửi ảnh sản phẩm vào ngày mai, shop chỉ có 1 page đang live, khách cẩn thận ạ.</span>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString('vi-VN');

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = day + "/" + month;

    document.getElementById("clock").textContent = time;
    document.getElementById("date").textContent = date;
}

function updateTickerWidth() {
    const container = document.querySelector(".container");
    const ticker = document.querySelector(".ticker");

    if (!container || !ticker) {
        return;
    }

    const width = Math.ceil(container.getBoundingClientRect().width) + "px";

    if (ticker.style.getPropertyValue("--ticker-width") !== width) {
        ticker.style.setProperty("--ticker-width", width);
    }
}

function scheduleClock() {
    updateClock();

    const now = new Date();
    const delay = 1000 - now.getMilliseconds();
    setTimeout(scheduleClock, delay);
}

scheduleClock();
updateTickerWidth();

if (document.fonts) {
    document.fonts.ready.then(updateTickerWidth);
}

window.addEventListener("resize", updateTickerWidth);
</script>

</body>
</html>
