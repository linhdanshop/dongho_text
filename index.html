<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đồng Hồ Trực Tuyến</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* đẩy lên trên */
        }

        .overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .container {
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        #clock {
            color: #ffffff;
            font-size: 90px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1; /* bỏ khoảng dư phía trên */
        }

        #date {
            color: #ffffff;
            font-size: 70px;
            font-weight: 700;
            line-height: 1;
        }

        .ticker {
            width: 100vw;
            max-width: 100vw;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
        }

        .ticker span {
            display: inline-block;
            padding-left: 100%;
            color: #ffd900;
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            animation: marquee 22s linear infinite;
        }

        @keyframes marquee {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <div id="clock"></div>
        <div id="date"></div>
    </div>

    <div class="ticker">
        <span>Không gọi xin mã, không nhắn tin lúc live, shop chốt đơn gửi ảnh sản phẩm vào ngày mai, shop chỉ có 1 page đang live, khách cẩn thận ạ.</span>
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString('vi-VN');

    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = day + "/" + month;

    document.getElementById("clock").innerHTML = time;
    document.getElementById("date").innerHTML = date;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
